name: Crewzen Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Continuous Integration (Lint, Typecheck & Next.js Build)
  # ---------------------------------------------------------------------------
  continuous-integration:
    name: 🔍 CI - Automated Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install clean dependencies
        run: npm ci

      - name: 🏗️ Verify TypeScript & Next.js Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          MONGODB_URI: "mongodb://localhost:27017/crewzen_saas"
        run: npm run build

  # ---------------------------------------------------------------------------
  # Stage 2: Continuous Delivery / Containerization (Docker Build & Push)
  # ---------------------------------------------------------------------------
  continuous-deployment:
    name: 🐳 CD - Docker Container Packaging & Image Verification
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Extract Git Metadata
        id: meta
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 🏗️ Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to true when Docker Hub credentials secrets are added
          tags: |
            crewzen-saas:latest
            crewzen-saas:${{ steps.meta.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deployment Success Status
        run: |
          echo "✅ Continuous Integration passed successfully!"
          echo "✅ Next.js standalone container bundle built without errors."
          echo "✅ Ready for production rollout on Kubernetes, AWS, or Cloud VPS."
