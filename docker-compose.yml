version: '3.8'

services:
  crewzen-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crewzen_saas_production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - MONGODB_URI=${MONGODB_URI}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/attendance/punch"]
      interval: 30s
      timeout: 10s
      retries: 3
